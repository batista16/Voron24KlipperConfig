
[mcu EBBSpicy]
canbus_uuid: 688255e1d011

[temperature_sensor EBBSpicy_temp]
sensor_type: temperature_mcu
sensor_mcu: EBBSpicy
min_temp: 0
max_temp: 100

# Controls on the mid+top chamber average. The PF6 thermistor alone (now CT_Gantry)
# read low-chamber air: with bed off + BedFans on it fell while the chamber heated,
# tripping verify_heater (2026-10-24).
[heater_generic HC]
sensor_type: temperature_combined
sensor_list: temperature_sensor CT_MidPost, temperature_sensor CT_TopHat
combination_method: mean
maximum_deviation: 40 # top/mid gap reached ~22 during heat-up; a dead sensor still trips
gcode_id: HC
heater_pin: PA3
min_temp: 0
max_temp: 130
control: pid
# Estimated 2026-10-25 from logged full-power steps (no PID_CALIBRATE yet):
# ~0.03-0.06 C/s per unit power, ~30 s dead time; SIMC-style PI, tau_c 120 s.
# Proportional band ~9 C so power tapers instead of slamming. Old (PF6-tuned):
# Kp 70.184 Ki 0.376 Kd 3274.071 — its Kd turned sensor noise into on/off.
pid_Kp: 28
pid_Ki: 0.07
pid_Kd: 400
smooth_time: 5

[temperature_sensor CT_Gantry]
sensor_type: Generic 3950 #NTC 100K MGB18-104F39050L32
sensor_pin: PF6 #A Drive chamber thermistor
min_temp: 0
max_temp: 130

[controller_fan HC_fan1]
pin: EBBSpicy:PA0
tachometer_pin: ^EBBSpicy:PB5
heater: HC
idle_timeout: 60
shutdown_speed: 1.0
stepper:

[controller_fan HC_fan2]
pin: EBBSpicy:PA1
tachometer_pin: ^EBBSpicy:PB7
heater: HC
idle_timeout: 60
shutdown_speed: 1.0
stepper:

[verify_heater HC]
max_error = 1000
heating_gain = 0.01
check_gain_time = 1200
hysteresis = 10

# Need to check wiring, giving toubl
[temperature_sensor CH_Core]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBSpicy:PA3
min_temp: -273.15
max_temp: 180 # normal peak ~155 at 100% HC; built-in thermostat 150 is the primary cutoff

[temperature_sensor CT_TopHat]
sensor_type:MAX31865
sensor_pin: EBBSpicy:PA4
spi_bus: spi1
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2
rtd_use_50Hz_filter: True

# Chamber_Average removed 2026-10-24: heater_generic HC now reads the mid+top average itself

#for orcaslicer integration below https://github.com/SoftFever/OrcaSlicer/wiki/Chamber-temperature
[gcode_macro M141]
gcode:
    SET_HEATER_TEMPERATURE HEATER=heater_chamber TARGET={params.S|default(0)} #HEATER=chamber_heater

[gcode_macro M191]
gcode:
    {% set s = params.S|float %}
    {% if s == 0 %}
        # If target temperature is 0, do nothing
        M117 Chamber heating cancelled
    {% else %}
        SET_HEATER_TEMPERATURE HEATER=HC TARGET={s}
        # Orca: uncomment the following line if you want to use heat bed to assist chamber heating
        M140 S110 #was uncommented. Was S100. Heats bed and doesnt wait
        TEMPERATURE_WAIT SENSOR="heater_generic HC" MINIMUM={s-2} MAXIMUM={s+15} #was s-1
        M117 Chamber at target temperature
    {% endif %}