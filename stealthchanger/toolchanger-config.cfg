# THIS IS NOT AN EXHAUSTIVE LIST!
# use this file to override values in the other configs. 
# any value that is available in the configs can be overriden here
# just add the section ie: [tool_probe T0] and the value that is being overridden.  

# this file must be the last file to be included since values will be stored in the order they are
# received.  Klipper will take the last value and store that for the macros. 

[rounded_path]
resolution: 0.2 # the length of a circle approximation segments.
replace_g0: False # Use at your own risk

[force_move]
enable_force_move: True

# z_offset can be stored here for easier retrieval vs in T0.cfg.
#[tool_probe T0]
#z_offset = -1.170 # TEXTURED PLATE

[toolchanger]
params_safe_y: 120
params_close_y: 33
params_fast_speed: 25000 # Go as fast as we can
params_path_speed: 1800  # slower on the path
# Pickup path: approach in front of dock (y+16), slide back to y0 low, lift z to engage the
# tool onto the carriage, then verify it seated.
# NOTE: the previous "YY wiggle" (y0<->y+1.0 reversals at full path speed, just before verify)
# jogged the already-loaded carriage fast enough to inertially deflect the optical Tap flexure
# -> the nozzle probe read "pressed" for >0.5s during the exit moves -> crash detection
# false-tripped on a tool that had actually seated (it re-detected fine when stationary, ~3s
# later). Reverted to the clean seat-and-verify path (matches the ktc-easy default).
params_pickup_path: [{'z':-10, 'y':16}, {'z':-10, 'y':0}, {'z':0, 'y':0, 'f':0.5, 'verify':1}, {'y':5.5, 'z':0}, {'y':9.5, 'z':2}, {'y':9.5 ,'z':4}]

# Override before/after_change_gcode (defaults defined in toolchanger/toolchanger.cfg,
# symlinked from ktc-easy). Wraps upstream behavior (color var + input shaper) and adds
# STATUS_* calls so each tool's LEDs reflect its actual role:
#   before_change_gcode runs with tool=OUTGOING — paint it to STATUS_READY (parked).
#   after_change_gcode  runs with tool=INCOMING — paint to STATUS_PRINTING if mid-print,
#                                                  else STATUS_READY.
# Klipper merges options across [toolchanger] sections and the last-defined option wins,
# so these supersede the ktc-easy defaults without de-symlinking toolchanger.cfg.
before_change_gcode:
  {% set tn = "T"+(tool.tool_number|string) %}
  {% if printer["gcode_macro " + tn ] %}
     SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="''"
     STATUS_READY T={tool.tool_number}
  {% endif %}

after_change_gcode:
  {% set tn = "T"+(tool.tool_number|string) %}
  {% if printer["gcode_macro " + tn ] %}
     SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="'c44'"
     {% if printer.print_stats.state in ('printing', 'paused') %}
       STATUS_PRINTING T={tool.tool_number}
     {% else %}
       STATUS_READY T={tool.tool_number}
     {% endif %}
  {% endif %}
  {% if tool.params_input_shaper_freq_x %}
    SET_INPUT_SHAPER SHAPER_FREQ_X={tool.params_input_shaper_freq_x} SHAPER_FREQ_Y={tool.params_input_shaper_freq_y}
  {% endif %}

# Override crash_gcode (defined in toolchanger/tool_detection.cfg, symlinked from ktc-easy).
# History of this override:
#  1) ktc-easy default ran M84, which unhomed the axes -> next queued move failed
#     "Must home axis first" and the print exited. Replaced with PAUSE (motors stay enabled,
#     SD reader stops cleanly). TURN_OFF_HEATERS kept as a safety measure.
#  2) PAUSE alone still crashed on RESUME: the crash fires while the toolhead is deep in the
#     dock, so pause_resume's SAVE_GCODE_STATE (see klipper/extras/pause_resume.py) captured
#     that in-dock coordinate; RESUME then runs RESTORE_GCODE_STATE MOVE=1 -- a single straight
#     move back to it -- driving the (already mounted) head into the dock. Fix: lift Z and
#     retract to safe_y BEFORE calling PAUSE, so the saved resume position is over the bed, not
#     in the dock. A crash pause is now safely resumable (reheat bed + active tool, then RESUME).
# crash_mintime raised 0.5 -> 1.0s: filters transient optical-Tap deflections; a real nozzle
# crash stays triggered far longer, so crash protection during printing is retained.
[tool_probe_endstop]
crash_mintime: 1.0
crash_gcode:
  STOP_TOOL_PROBE_CRASH_DETECTION
  {% set tn = printer.toolchanger.tool_number %}
  {% set safe_y = printer.toolchanger.params_safe_y|float %}
  {% set fast = printer.toolchanger.params_fast_speed|float %}
  {% set max_z = printer.configfile.settings.stepper_z.position_max|float %}
  RESPOND TYPE=error MSG='Tool not detected, expected {tn}. Retracting out of dock, then pausing.'
  {% if 'xyz' in printer.toolhead.homed_axes %}
    G90
    G0 Z{[printer.toolhead.position[2]|float + 10.0, max_z]|min} F1200
    G0 Y{safe_y} F{fast}
  {% endif %}
  PAUSE
  TURN_OFF_HEATERS


# this section must be completed
[gcode_macro homing_override_config]
variable_sensorless_x: True
variable_sensorless_y: True
variable_homing_rebound_y: 20 # for sensorless you probably want this set to 20.
variable_stepper_driver: "tmc2209"
variable_homing_current: 0.49

# M109 macro is overridden to allow some deadband on the temp
# default is +- 1 degree.  So if the set temp is 250 the the default
# deadband will be 249-251.  You can adjust this here:

[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
variable_default_deadband: 4.0

# uncomment this to automatically INITIALIZE_TOOLCHANGER
# when klipper starts.
[delayed_gcode startup]
initial_duration: 1
gcode:
  INITIALIZE_TOOLCHANGER
  # INITIALIZE_TOOLCHANGER only fires after_change_gcode for the detected
  # active tool — non-active tools keep running their autostart sb_idle_*
  # breathing effect. Repaint each parked tool to STATUS_READY so the whole
  # toolchanger settles into a consistent static standby state at boot.
  {% set active = printer.tool_probe_endstop.active_tool_number|int %}
  {% for n in range(printer.toolchanger.tool_names | length) %}
    {% if n != active %}
      STATUS_READY T={n}
    {% endif %}
  {% endfor %}

# these values need to be set to match the location of your Calibration Switch
[gcode_macro _CALIBRATION_SWITCH]
variable_x: 78.618750
variable_y: 3.175000
variable_z: 6.395396
gcode:

[tools_calibrate]
pin: PG11 #pin that your calibration probe is connected to.
travel_speed: 20  # mms to travel sideways for XY probing
spread: 5  # mms to travel down from top for XY probing
lower_z: 1.0  # The speed (in mm/sec) to move tools down onto the probe
speed: 2  # The speed (in mm/sec) to retract between probes
lift_speed: 4  # Z Lift after probing done, should be greater than any Z variance between tools
final_lift_z: 6 
sample_retract_dist:2
samples_tolerance:0.5
samples:5
samples_result: median # median, average
# Settings for nozzle probe calibration - optional.
#probe: probe # name of the nozzle probe to use
#trigger_to_bottom_z: 0.25 # Offset from probe trigger to vertical motion bottoms out. 
# decrease if the nozzle is too high, increase if too low.
